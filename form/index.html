<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Jogo Interativo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Do+Hyeon&display=swap" rel="stylesheet">
</head>
<body>

    <div class="frame-1" data-figma-name="Frame 1">
        <div class="rectangle-3" data-figma-name="Rectangle 3"></div>
        <div class="background-image" data-figma-name="4938346-nature-scene-background-children-theme-cartoon-trees-sky-clouds-path-green-field-for-kids-cartoon-vector-landscape-vetor(1) 1"></div>

        <div class="group" data-figma-name="Group" aria-hidden="true">
            <span class="g-letter" data-figma-name="C">C</span>
            <span class="g-letter" data-figma-name="U">U</span>
            <span class="g-letter" data-figma-name="L">L</span>
            <span class="g-letter" data-figma-name="T">T</span>
            <span class="g-letter" data-figma-name="U">U</span>
            <span class="g-letter" data-figma-name="R">R</span>
            <span class="g-letter" data-figma-name="A">A</span>
            <span class="g-letter" data-figma-name="_">&nbsp;</span>
            <span class="g-letter" data-figma-name="D">D</span>
            <span class="g-letter" data-figma-name="E">E</span>
            <span class="g-letter" data-figma-name="_">&nbsp;</span>
            <span class="g-letter" data-figma-name="B">B</span>
            <span class="g-letter" data-figma-name="R">R</span>
            <span class="g-letter" data-figma-name="U">U</span>
            <span class="g-letter" data-figma-name="S">S</span>
            <span class="g-letter" data-figma-name="Q">Q</span>
            <span class="g-letter" data-figma-name="U">U</span>
            <span class="g-letter" data-figma-name="E">E</span>
        </div>

        <div class="rectangle-8" data-figma-name="Rectangle 8"></div>

        <form class="rectangle-7" data-figma-name="Rectangle 7">
            <input id="nome" class="rectangle-9 field-nome" data-figma-name="Rectangle 9" type="text" autocomplete="name" />
            <div class="text-nome label-nome" data-figma-name="NOME:">NOME:</div>

            <input id="escola" class="rectangle-10 field-escola" data-figma-name="Rectangle 10" type="text" autocomplete="organization" />
            <div class="text-escola label-escola" data-figma-name="ESCOLA:">ESCOLA:</div>

            <input id="idade" class="rectangle-11 field-idade" data-figma-name="Rectangle 11" type="text" inputmode="numeric" autocomplete="off" />
            <div class="text-idade label-idade" data-figma-name="IDADE:">IDADE:</div>

            <button class="rectangle-6" data-figma-name="Rectangle 6" type="submit">
                <span class="text-entrar" data-figma-name="ENTRAR">ENTRAR</span>
            </button>
        </form>
    </div>

    <script>
        (() => {
            const MIN_SCALE = 0.34;

            function px(value) {
                const n = Number.parseFloat(value);
                return Number.isFinite(n) ? n : 0;
            }

            function updateTitleScale() {
                const frame = document.querySelector('.frame-1');
                const group = document.querySelector('.group');
                if (!frame || !group) return;
                const SAFE_SIDE_MARGIN = 24;

                const cs = getComputedStyle(frame);
                const paddingX = px(cs.paddingLeft) + px(cs.paddingRight);
                const availableWidth = Math.max(0, frame.clientWidth - paddingX);
                const usableWidth = Math.max(0, availableWidth - (SAFE_SIDE_MARGIN * 2));

                // Mede o alcance real das letras (elas podem extrapolar a caixa da .group)
                const previousInlineScale = group.style.getPropertyValue('--title-scale');
                group.style.setProperty('--title-scale', '1');
                // Força reflow antes da medição
                group.getBoundingClientRect();

                const frameRect = frame.getBoundingClientRect();
                const frameCenterX = frameRect.left + (frameRect.width / 2);

                const letters = group.querySelectorAll('.g-letter');
                let minLeft = Infinity;
                let maxRight = -Infinity;

                letters.forEach((el) => {
                    const r = el.getBoundingClientRect();
                    if (r.width === 0 && r.height === 0) return;
                    minLeft = Math.min(minLeft, r.left);
                    maxRight = Math.max(maxRight, r.right);
                });

                let requiredWidth = 817.26;
                if (Number.isFinite(minLeft) && Number.isFinite(maxRight)) {
                    const halfWidth = Math.max(frameCenterX - minLeft, maxRight - frameCenterX);
                    requiredWidth = Math.max(1, halfWidth * 2);
                }

                let scale = usableWidth / requiredWidth;
                scale = Math.min(1, Math.max(MIN_SCALE, scale));
                group.style.setProperty('--title-scale', scale.toFixed(4));

                // Restaura caso algo dê errado
                if (!Number.isFinite(scale)) {
                    if (previousInlineScale) group.style.setProperty('--title-scale', previousInlineScale);
                    else group.style.removeProperty('--title-scale');
                }
            }

            updateTitleScale();
            if (document.fonts && document.fonts.ready) {
                document.fonts.ready.then(updateTitleScale).catch(() => {});
            }
            requestAnimationFrame(updateTitleScale);
            window.addEventListener('resize', updateTitleScale, { passive: true });
            window.addEventListener('orientationchange', updateTitleScale, { passive: true });
        })();
    </script>
</body>
</html>
